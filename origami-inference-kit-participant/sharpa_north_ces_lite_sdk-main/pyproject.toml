[project]
name = "origami-participant-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "eclipse-zenoh>=1.9.0",
    "msgpack>=1.0.5",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
]

[project.scripts]
origami-local-evaluator = "participant_local_evaluator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["participant_local_evaluator"]
